services:
  - type: worker
    name: jiohotstar-notification-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: FORCE_JOIN_CHANNEL
        sync: false
      - key: TIMEZONE
        value: Asia/Dhaka
      - key: POLL_MINUTES
        value: "180"
